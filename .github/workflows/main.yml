name: Main

on:
  workflow_dispatch:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Lint GitHub Actions workflows
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color

      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run metadata and CSS checks
        run: npm run check

      - name: Build theme
        run: npm run build

      - name: Package theme
        shell: pwsh
        run: ./tools/package.ps1 -SkipBuild

      - name: Upload theme package
        uses: actions/upload-artifact@v6
        with:
          name: claude-theme
          path: |
            dist/theme/
            dist/Claude-*.tar.gz
          if-no-files-found: error
          compression-level: 0
