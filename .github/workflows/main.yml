on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate_theme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run check

  package_theme:
    needs: validate_theme
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run package

      - name: Upload theme package
        uses: actions/upload-artifact@v7
        with:
          name: claude-theme
          path: |
            dist/theme/
            dist/Claude-*.tar.gz
          if-no-files-found: error
          compression-level: 0
