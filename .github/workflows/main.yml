on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          cache: npm
          node-version-file: package.json
      - run: npm ci
      - run: npm run lint

  build:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          cache: npm
          node-version-file: package.json
      - run: npm ci
      - run: npm run build
      - id: get-version
        run: echo "theme-version=$(jq -r '.version' manifest.json)" >> "$GITHUB_OUTPUT"
      - run: |
          tar -czf "Claude_${{ steps.get-version.outputs.theme-version }}.tar.gz" -C dist theme.css manifest.json
      - uses: actions/upload-artifact@v7
        with:
          path: Claude_${{ steps.get-version.outputs.theme-version }}.tar.gz
          archive: false
          if-no-files-found: error
