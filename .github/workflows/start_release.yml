name: Start release

on:
  push:
    tags:
      - "*.*.*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  validate_theme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run check

  package_theme:
    needs: validate_theme
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run package

      - name: Upload release assets
        uses: actions/upload-artifact@v6
        with:
          name: release-assets
          path: |
            dist/theme/
            dist/Claude-*.tar.gz
          if-no-files-found: error
          compression-level: 0

  attest_release_assets:
    needs: package_theme
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: release-assets
          path: dist

      - name: Attest release assets
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/theme/manifest.json
            dist/theme/theme.css
            dist/Claude-*.tar.gz

  create_draft_release:
    needs: attest_release_assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: release-assets
          path: dist

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create $env:GITHUB_REF_NAME `
            --title "Claude $env:GITHUB_REF_NAME" `
            --draft `
            dist/theme/manifest.json `
            dist/theme/theme.css `
            dist/Claude-$env:GITHUB_REF_NAME.tar.gz
